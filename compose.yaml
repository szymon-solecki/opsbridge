x-notification-policy: &notification-policy
  OPSBRIDGE_NOTIFICATION_POLICIES: "${OPSBRIDGE_NOTIFICATION_POLICIES:-}"

services:
  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d"]
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    networks: [monitoring]
  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:12.4.15
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_BASIC_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
    volumes:
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    networks: [monitoring]
    depends_on: [prometheus]
  mailpit:
    profiles: ["notifications"]
    image: axllent/mailpit:v1.27
    environment:
      MP_DATABASE: /data/mailpit.db
    volumes:
      - mailpit_data:/data
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"
    networks: [mailpit_sink]
    restart: unless-stopped
  notification-worker:
    profiles: ["notifications"]
    image: opsbridge-backend:local
    build: ./backend
    entrypoint: ["python", "-m", "backend.app.notification_worker"]
    environment:
      DATABASE_URL: "${INTAKE_DATABASE_URL:-}"
      OPSBRIDGE_EXPECTED_DATABASE: opsbridge_test
      PYTHON_DOTENV_DISABLED: "1"
      OPSBRIDGE_MAILPIT_HOST: mailpit
      OPSBRIDGE_METRICS_PORT: "9100"
    networks: [default, mailpit_sink, monitoring]
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    restart: unless-stopped
  rabbitmq:
    profiles: ["events"]
    image: rabbitmq:4.2-management
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_DEFAULT_USER:-}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_DEFAULT_PASS:-}"
    ports:
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./infra/monitoring/rabbitmq-plugins:/etc/rabbitmq/enabled_plugins:ro
    networks: [default, monitoring]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped
  outbox-publisher:
    profiles: ["events"]
    image: opsbridge-backend:local
    build: ./backend
    entrypoint: ["python", "-m", "backend.app.event_worker", "publish"]
    environment: &event-environment
      DATABASE_URL: "${INTAKE_DATABASE_URL:-}"
      RABBITMQ_URL: "${RABBITMQ_URL:-}"
      OPSBRIDGE_METRICS_PORT: "9100"
      OPSBRIDGE_EXPECTED_DATABASE: opsbridge_test
      PYTHON_DOTENV_DISABLED: "1"
    networks: [default, monitoring]
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    restart: unless-stopped
  activity-consumer:
    profiles: ["events"]
    image: opsbridge-backend:local
    build: ./backend
    entrypoint: ["python", "-m", "backend.app.event_worker", "consume"]
    environment: *event-environment
    networks: [default, monitoring]
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    restart: unless-stopped
  dashboard:
    profiles: ["dashboard"]
    build: ./frontend
    environment:
      OPSBRIDGE_GRAFANA_URL: "${OPSBRIDGE_GRAFANA_URL:-}"
      OPSBRIDGE_PROMETHEUS_URL: "${OPSBRIDGE_PROMETHEUS_URL:-}"
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-8080}:8080"
    depends_on: [api]
  api:
    profiles: ["dashboard"]
    build: ./backend
    entrypoint: ["python", "-m", "uvicorn", "backend.app.main:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
    environment:
      DATABASE_URL: "${INTAKE_DATABASE_URL:-}"
      RABBITMQ_URL: "${RABBITMQ_URL:-}"
      PYTHON_DOTENV_DISABLED: "1"
      OPSBRIDGE_COPILOT_PROVIDER: "${OPSBRIDGE_COPILOT_PROVIDER:-mock}"
      OPSBRIDGE_COPILOT_MODEL: "${OPSBRIDGE_COPILOT_MODEL:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      <<: *notification-policy
    networks: [default, monitoring]
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/ready', timeout=12).close()"]
      interval: 30s
      timeout: 15s
      start_period: 10s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
  sla-worker:
    profiles: ["operations"]
    image: opsbridge-backend:local
    build: ./backend
    entrypoint: ["python", "-m", "backend.app.operations_worker", "sla"]
    environment: &operations-environment
      <<: *notification-policy
      DATABASE_URL: "${INTAKE_DATABASE_URL:-}"
      OPSBRIDGE_EXPECTED_DATABASE: opsbridge_test
      PYTHON_DOTENV_DISABLED: "1"
      OPSBRIDGE_METRICS_PORT: "9100"
    networks: [default, monitoring]
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
  processing-worker:
    profiles: ["operations"]
    image: opsbridge-backend:local
    build: ./backend
    entrypoint: ["python", "-m", "backend.app.operations_worker", "processing"]
    user: "9001:9001"
    group_add: ["1999"]
    environment: *operations-environment
    networks: [default, monitoring]
    volumes:
      - sftp_data:/srv/opsbridge-sftp:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
  reconciliation-worker:
    profiles: ["operations"]
    image: opsbridge-backend:local
    build: ./backend
    entrypoint: ["python", "-m", "backend.app.operations_worker", "reconciliation"]
    user: "9001:9001"
    group_add: ["1999"]
    environment: *operations-environment
    networks: [default, monitoring]
    volumes:
      - sftp_data:/srv/opsbridge-sftp:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: "${POSTGRES_DB:?POSTGRES_DB must be set in .env}"
      POSTGRES_USER: "${POSTGRES_USER:?POSTGRES_USER must be set in .env}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}"
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  intake-worker:
    profiles: ["intake"]
    build: ./backend
    image: opsbridge-backend:local
    user: "9001:9001"
    group_add: ["1999"]
    environment:
      <<: *notification-policy
      DATABASE_URL: "${INTAKE_DATABASE_URL:-}"
      OPSBRIDGE_EXPECTED_DATABASE: opsbridge_test
      PYTHON_DOTENV_DISABLED: "1"
      OPSBRIDGE_METRICS_PORT: "9100"
    networks: [default, monitoring]
    volumes:
      - sftp_data:/srv/opsbridge-sftp
    depends_on:
      postgres:
        condition: service_healthy
      sftp:
        condition: service_started
    restart: unless-stopped
  sftp:
    image: opsbridge-sftp:local
    build:
      context: ./infra/sftp
    ports:
      - "127.0.0.1:${SFTP_PORT:-2222}:22"
    volumes:
      - type: bind
        source: ${SFTP_ACCOUNTS_FILE:-./.secrets/sftp-accounts.json}
        target: /run/config/sftp-accounts.json
        read_only: true
        bind:
          create_host_path: false
      - sftp_data:/srv/opsbridge-sftp
      - sftp_host_keys:/var/lib/ssh-host-keys
    networks:
      - sftp_ingress
    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:
  mailpit_data:
  rabbitmq_data:
  postgres_data:
  sftp_data:
  sftp_host_keys:

networks:
  monitoring:
    driver: bridge
  mailpit_sink:
    driver: bridge
  sftp_ingress:
    driver: bridge
