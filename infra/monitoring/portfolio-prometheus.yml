global:
  scrape_interval: 5s
  scrape_timeout: 4s

scrape_configs:
  - job_name: opsbridge-api
    static_configs:
      - targets: ["127.0.0.1:8000"]
  - job_name: rabbitmq
    metrics_path: /metrics/per-object
    static_configs:
      - targets: ["127.0.0.1:15692"]
    metric_relabel_configs:
      - source_labels: [__name__, queue]
        regex: 'rabbitmq_queue_messages(_ready|_unacked)?;opsbridge\.activity\.(dead\.)?v1'
        action: keep
