global:
  scrape_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: opsbridge-api
    static_configs:
      - targets: ["api:8000"]
  - job_name: opsbridge-intake
    static_configs:
      - targets: ["intake-worker:9100"]
  - job_name: opsbridge-processing
    static_configs:
      - targets: ["processing-worker:9100"]
  - job_name: opsbridge-sla
    static_configs:
      - targets: ["sla-worker:9100"]
  - job_name: opsbridge-reconciliation
    static_configs:
      - targets: ["reconciliation-worker:9100"]
  - job_name: opsbridge-notifications
    static_configs:
      - targets: ["notification-worker:9100"]
  - job_name: opsbridge-publisher
    static_configs:
      - targets: ["outbox-publisher:9100"]
  - job_name: opsbridge-consumer
    static_configs:
      - targets: ["activity-consumer:9100"]
  - job_name: rabbitmq
    metrics_path: /metrics/per-object
    static_configs:
      - targets: ["rabbitmq:15692"]
    metric_relabel_configs:
      - source_labels: [__name__, queue]
        regex: 'rabbitmq_queue_messages(_ready|_unacked)?;opsbridge\.activity\.(dead\.)?v1'
        action: keep
